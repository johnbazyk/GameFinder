# GameFinder — TanStack Start (vite + nitro) on Netlify.
# The nitro "netlify" preset (vite.config.ts, active when NETLIFY is set)
# emits the SSR handler into .netlify/functions-internal and static assets
# into dist; publish must stay "dist".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
